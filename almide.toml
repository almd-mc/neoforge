[package]
name = "neoforge"
version = "0.2.0"

[dependencies]
aes = { git = "https://github.com/almide/aes" }
mc-protocol = { git = "https://github.com/almd-mc/mc-protocol" }

# Dialect epoch 15 (#4093): a git dependency outside github.com/almide is fetched only
# from an owner the root manifest trusts.
[trust]
owners = ["github.com/almd-mc"]

[permissions]
native = ["aes"]
